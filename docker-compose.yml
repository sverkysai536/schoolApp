version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_OM_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build: ./ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # On EC2, change localhost to Public IP/Domain
    depends_on:
      - backend

volumes:
  redis_data:
